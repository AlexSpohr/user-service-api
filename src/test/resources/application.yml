spring:
  hateoas:
    use-hal-as-default-json-media-type: false

springdoc:
  swagger-ui:
  path: /api/v1/swagger.html
---

spring:
  config:
    activate:
      on-profile: unit
---

spring:
  config:
    activate:
      on-profile: integration
      flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
      datasource:
        url: jdbc:h2:mem:postgres
        driverClassName: org.h2.Driver
      jpa:
        show-sql: true
      management:
        tracing:
          enabled: false
---

